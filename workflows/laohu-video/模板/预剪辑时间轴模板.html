<html lang="zh-CN">

<title>成片审稿 · 老胡</title>
<style>
:root{--paper:#f6f5f0;--ink:#233b38;--sub:#687672;--line:#d4dcd5;--green:#17634e;--lime:#ddecc3;--orange:#a95821;--cream:#fcf0db;--blue:#275a88;--white:#fffefa;--rail:32px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:110px}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.65}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{outline-offset:4px}button{cursor:pointer;color:inherit}button,.btn{background:var(--white);border:1px solid var(--line);padding:8px 13px;border-radius:7px}button:hover{border-color:var(--green);background:#edf3e8}button:disabled{opacity:.4;cursor:default}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,3vw,42px);font-weight:650;letter-spacing:-1px;line-height:1.25}h2{font-size:21px}h3{font-size:17px}small,.muted{color:var(--sub)}.mono,time{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px}.wrap{max-width:1660px;padding:0 36px;margin:auto}.mast{padding-top:36px;display:flex;justify-content:space-between;gap:28px;align-items:flex-end}.eyebrow{font-size:11px;letter-spacing:2px;margin-bottom:12px;color:var(--green);font-weight:700}.intro{margin:12px 0;color:var(--sub);max-width:900px}.stamp{white-space:nowrap;border-left:1px solid var(--line);padding:4px 0 4px 22px}.stamp b{display:block;font-size:22px}.notice{margin-top:17px;padding:10px 14px;background:var(--cream);border-left:3px solid #c5793c;color:#74482b}.summary{display:flex;gap:27px;margin-top:25px;padding:17px 0;border-block:1px solid var(--line)}.summary b{font-size:22px;margin-right:7px}.summary span{font-size:12px;color:var(--sub)}.section-top{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.question{background:var(--white);padding:17px 19px;border:1px solid var(--line);border-top:3px solid #c3884d;border-radius:5px}.question.resolved{border-top-color:#8faa7c}.tag{display:inline-block;font-size:11px;line-height:1.7;padding:2px 7px;border-radius:4px;background:#e9eee7;color:var(--green);font-weight:600}.tag.pending{background:var(--cream);color:var(--orange)}.tag.event{background:#e6edf4;color:var(--blue)}.tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.question h3{margin:9px 0;font-size:15px}.question p{font-size:13px;color:var(--sub)}.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.links button{padding:4px 8px;font-size:12px}.comment{display:block;margin-top:12px}.comment span{font-size:12px;color:var(--sub)}textarea{display:block;width:100%;resize:vertical;min-height:62px;background:#fbfcf8;border:1px solid var(--line);border-radius:5px;padding:9px;color:var(--ink)}.toolbar{position:sticky;top:0;z-index:5;background:rgba(246,245,240,.98);border-block:1px solid var(--line);padding:12px 0;margin-top:24px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar input{width:230px;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:var(--white)}.toolbar select{max-width:210px;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:9px}.spacer{flex:1}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#244c3d;color:white}.timeline-head{display:grid;grid-template-columns:minmax(0,1fr) var(--rail) minmax(0,1fr);gap:8px;padding:24px 0 12px}.left-head{display:grid;grid-template-columns:110px 140px minmax(0,1fr);gap:12px;font-size:12px;color:var(--sub)}.right-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}.right-head b{color:var(--green);font-weight:600}.axis-label{font-size:10px;text-align:center;color:var(--green)}.chapter{padding:17px 0 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.chapter .num{font-size:12px;background:var(--ink);color:#fff;padding:3px 8px;border-radius:4px}.chapter h2{font-size:17px}.chapter time{margin-left:auto;color:var(--sub)}.block{display:grid;grid-template-columns:minmax(0,1fr) var(--rail) minmax(0,1fr);gap:8px;position:relative;scroll-margin-top:115px}.segments{display:flex;flex-direction:column}.cue{flex:1;display:grid;grid-template-columns:110px 140px minmax(0,1fr);gap:12px;padding:19px 9px 19px 0;border-top:1px solid #e1e5de;scroll-margin-top:125px;position:relative}.cue .final{color:var(--green);font-weight:650}.cue time{display:block;line-height:1.75}.cue .source{color:var(--sub);overflow-wrap:anywhere}.source small{display:block;font-size:10px;margin-bottom:3px}.source .plus{display:block;padding:3px 0;color:#8c9990}.cue p{font-size:16px;line-height:1.8}.cue .cue-id{display:inline-block;font-size:10px;color:var(--sub);margin-bottom:5px;letter-spacing:.5px}.note{margin-top:8px;font-size:12px;color:#87603e;padding-left:9px;border-left:2px solid #ccb899}.event-cue p{color:var(--blue)}.event-cue{background:linear-gradient(90deg,transparent,#edf2f4)}.rail{position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:21px}.rail:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #b6cbbb}.rail:after{content:"";width:10px;height:10px;background:var(--paper);border:2px solid var(--green);border-radius:50%;z-index:1}.visual{margin:5px 0 16px 4px;align-self:stretch;background:var(--white);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:5px;padding:17px 18px;position:relative}.visual:before{content:"";position:absolute;width:22px;border-top:1px solid var(--green);left:-23px;top:21px}.visual.base{background:#eef1e9;border-left-color:#839579}.visual h3{margin:9px 0 6px}.visual .reason{font-size:12px;color:var(--sub);margin:7px 0 13px}.range-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--green);font-size:11px;margin:9px 0}.range-line time{padding:3px 6px;background:#edf3e7;border-radius:4px;font-size:11px}.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,36%);gap:16px;margin-top:12px}.design.no-assets{display:block}.design p{font-size:14px;line-height:1.9}.gallery{display:grid;gap:10px;align-content:start}.asset{margin:0}.asset button{display:block;width:100%;padding:0;overflow:hidden;background:#f0f3eb;border:1px solid var(--line);border-radius:5px}.asset img{width:100%;max-height:160px;object-fit:contain;display:block}.asset svg{display:block;width:100%;height:auto;max-height:120px}.asset figcaption{font-size:11px;line-height:1.65;margin-top:4px;color:var(--sub)}.asset figcaption b{color:var(--ink)}.missing{background:repeating-linear-gradient(135deg,#f6f3eb,#f6f3eb 8px,#eeeae1 8px,#eeeae1 9px);padding:23px 10px;text-align:center;font-size:12px;color:#8a6543;border:1px dashed #cbbb9f;border-radius:5px}.handoff{font-size:12px;padding:9px 10px;background:#eff4e8;color:#456146;margin-top:13px;border-radius:4px}.detail{border-top:1px solid var(--line);margin-top:13px;padding-top:10px}.detail summary{cursor:pointer;font-size:12px;color:var(--green)}.beats{padding:0;list-style:none}.beats li{padding:9px 0;border-top:1px solid #e7ebe3;font-size:12px}.beats p{margin:4px 0}.beats small{display:block}.gap{grid-column:1/-1;color:var(--sub);font-size:11px;padding:4px 0 4px 10px;border-top:1px dotted var(--line)}.block:hover .rail:after{background:var(--green)}.focus-item{outline:2px solid #b48132;outline-offset:3px}.search-hit{background:#fff1b7!important}.source-audit{margin-top:24px;padding:20px;background:var(--white);border:1px solid var(--line);border-radius:6px}.source-audit summary{cursor:pointer}.audit-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}.audit-table td,.audit-table th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}.footer{padding:28px 0 50px;font-size:12px;color:var(--sub)}.footer p{margin:8px 0}.save-state{font-size:11px;color:var(--sub);min-height:20px;margin-top:7px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);border-radius:8px;max-width:90vw;width:960px;max-height:90vh;padding:20px;background:var(--white);color:var(--ink)}dialog::backdrop{background:#132c29ad}dialog img,dialog svg{max-width:100%;max-height:72vh;display:block;margin:15px auto}dialog .close{float:right}.empty{padding:12px;color:var(--sub)}
@media(min-width:1450px){.left-head,.cue{grid-template-columns:126px 162px minmax(0,1fr)}}
@media(max-width:1000px){.wrap{padding:0 20px}.left-head,.cue{grid-template-columns:86px 106px minmax(0,1fr);gap:8px}.mono,time{font-size:10px}.cue p{font-size:14px}.design{display:block}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}.visual{padding:14px}.toolbar input{width:185px}}
@media(max-width:700px){.wrap{padding:0 15px}.mast{align-items:flex-start;gap:15px;padding-top:24px}.stamp{padding-left:10px;font-size:11px}.stamp b{font-size:16px}.summary{gap:14px;flex-wrap:wrap}.summary b{font-size:18px}.questions{grid-template-columns:1fr}.timeline-head{display:block}.left-head{grid-template-columns:80px 98px 1fr}.right-head{margin-top:10px}.axis-label{display:none}.block{grid-template-columns:16px minmax(0,1fr);gap:10px}.rail{grid-column:1;grid-row:1/3}.segments{grid-column:2;grid-row:1}.visual{grid-column:2;grid-row:2;margin-left:0}.visual:before{width:13px;left:-14px}.cue{grid-template-columns:80px 98px minmax(0,1fr);gap:7px;padding-right:0}.cue p{font-size:13px}.chapter h2{font-size:15px}.chapter time{font-size:10px}.toolbar{gap:7px}.toolbar select{max-width:150px}.toolbar input{width:155px}.toolbar button{padding:7px 10px}.toolbar .spacer{display:none}.design{display:grid;grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}.audit-scroll{overflow-x:auto}.audit-table{min-width:650px}}
@media print{body{background:white;font-size:11px}.wrap{padding:0}.toolbar,.comment,.links,.save-state,dialog{display:none!important}.mast{padding-top:0}.visual,.question{break-inside:avoid}.block{break-inside:auto}.detail{display:block}.cue p{font-size:12px}.left-head,.cue{grid-template-columns:90px 110px 1fr}.gallery{grid-template-columns:repeat(3,1fr)}.design{display:block}.stamp{display:none}.notice{background:white}.footer{padding:15px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<body>
<div class="wrap">
<header class="mast"><div><div class="eyebrow">老胡 / 成片审稿</div><h1 id="title"></h1><p class="intro">先把这条片子看明白，再一起决定怎么做。左边跟着讲述，右边看画面如何接住它。</p></div><div class="stamp"><small id="revision"></small><b id="approval"></b></div></header>
<div id="notice" class="notice"></div><div class="summary" id="summary"></div>
<details class="source-audit" id="brief"><summary>本片方向与字幕样式</summary><div id="brief-content"></div></details>
<section aria-labelledby="questions-title"><div class="section-top"><h2 id="questions-title">先处理这些问题</h2><span id="question-count" class="muted"></span></div><div id="questions" class="questions"></div></section>
<nav class="toolbar" aria-label="审稿工具"><label><span class="sr-only">搜索字幕、备注或动画</span><input id="search" type="search" placeholder="搜索字幕、备注、动画…"></label><button id="prev" aria-label="上一个搜索结果">↑</button><button id="next" aria-label="下一个搜索结果">↓</button><span id="matches" class="muted" aria-live="polite"></span><label><span class="sr-only">跳到章节</span><select id="chapters"><option value="">跳到章节</option></select></label><span class="spacer"></span><button id="copy">复制修改意见</button><button id="download" class="primary">下载修改意见</button></nav>
<div id="save-state" class="save-state" role="status">可在疑难与画面方案下写意见，再复制或下载交给我。</div>
<div class="timeline-head"><div class="left-head"><span>预期成片时间</span><span>源时间 · 可追溯</span><span>最终拟用字幕 / 无字幕事件</span></div><div class="axis-label">时间轴</div><div class="right-head"><b>画面安排 / 动画导演方案</b><span>按段排布 · 高度不代表时长</span></div></div>
<main id="timeline"></main>
<details class="source-audit"><summary>源素材保留与删除 · 展开核查</summary><p class="muted">删除项保留源时间与理由，不混入成片时间轴。</p><div class="audit-scroll"><table class="audit-table"><thead><tr><th>编号 / 决定</th><th>源时间</th><th>源内容或事件</th><th>理由</th></tr></thead><tbody id="audit"></tbody></table></div></details>
<footer class="footer"><p id="timing"></p><p id="approval-record"></p><p>这里写下的是讨论意见。修改会合入同一份方案；整份确认后，才开始剪辑与动画制作。</p><p id="fingerprint"></p></footer>
</div>
<dialog id="lightbox"><button class="close" id="close">关闭 ×</button><h3 id="image-title"></h3><div id="image-content"></div><p id="image-use" class="muted"></p></dialog>
<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
'use strict';
const d=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const domId=id=>'ref-'+encodeURIComponent(id);
const stamp=t=>{const ms=Math.round(t*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0')};
const rangeText=r=>stamp(r.start)+'–'+stamp(r.end);
const statusText={PENDING:'待讨论',REVISED:'已修改 · 待确认',CONFIRMED:'已确认'};
const modeText={BASE:'保留底画',LOCAL:'局部标注',SIDE:'侧边展示',FULL:'全幅展示'};
const notesKey='laohu-review:'+d.id+':'+d.revision+':'+d.fingerprint;
let notes={};try{const raw=JSON.parse(localStorage.getItem(notesKey)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))notes=raw;}catch{}
const feedbackFields=[];
function feedback(key,label){const l=el('label','comment');l.append(el('span','',label));const t=el('textarea');t.placeholder='写下你的意见，例如：图二放大，停留再久一点';t.value=typeof notes[key]==='string'?notes[key]:'';t.dataset.feedback=key;feedbackFields.push(t);t.addEventListener('input',()=>{notes[key]=t.value;try{localStorage.setItem(notesKey,JSON.stringify(notes));$('save-state').textContent='意见草稿已暂存在当前浏览器；请复制或下载后交给我，尚未写回制作方案。';}catch{$('save-state').textContent='浏览器未能保存草稿，请在关闭页面前复制或下载修改意见。';}});l.append(t);return l;}
let focusTimer;
function jump(id){const n=$(domId(id));if(!n)return;document.querySelectorAll('.focus-item').forEach(e=>e.classList.remove('focus-item'));n.classList.add('focus-item');n.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});clearTimeout(focusTimer);focusTimer=setTimeout(()=>n.classList.remove('focus-item'),5000);}
function link(id,label=id){const b=el('button','',label);b.type='button';b.addEventListener('click',()=>jump(id));return b;}
function sources(ranges){const out=el('div','source');ranges.forEach((r,i)=>{if(i)out.append(el('span','plus','＋'));const label=r.label||r.file.split(/[\\/]/).pop();const name=el('small','',label);name.title=r.file;out.append(name,el('time','',rangeText(r)));});return out;}
$('title').textContent=d.title;document.title=d.title+' · 成片审稿';$('revision').textContent='方案修订 '+d.revision;$('approval').textContent=d.approval.status==='APPROVED'?'已整体确认':'待整体确认';
$('notice').textContent=d.isExample?'格式示例 · 字幕、时码与图形均用于展示审稿方式，不是实际作品的剪辑或动画授权。':d.timing.basis==='HISTORICAL'?'历史审稿视图 · 时间可能已被后续剪辑替代，不能直接用于当前制作。':d.timing.basis==='FROZEN'?'当前显示冻结成片时间。画面或剪辑若发生实质修改，需要重新确认对应方案。':'当前显示虚拟剪辑后的预期时间。整份确认后再冻结时间轴并制作。';
for(const [label,value]of [['给谁看',d.brief.audience],['讲述主线',d.brief.mainline],['字幕样式',d.brief.captionStyle]])$('brief-content').append(el('p','note',label+'：'+value));
const openQs=d.questions.filter(q=>q.status==='OPEN');
for(const [value,label]of [[rangeText(d.scope),'审稿范围'],[d.segments.length,'条字幕 / 事件'],[d.visuals.filter(v=>v.mode!=='BASE').length,'段画面增强'],[openQs.length,'个待解决问题']]){const n=el('div');n.append(el('b','',String(value)),el('span','',label));$('summary').append(n);}
$('question-count').textContent=openQs.length?'解决后一起确认方案':'没有未决疑难';
for(const q of [...d.questions].sort((a,b)=>(a.status==='RESOLVED')-(b.status==='RESOLVED'))){const card=el('article','question'+(q.status==='RESOLVED'?' resolved':''));card.id=domId(q.id);const tags=el('div','tags');tags.append(el('span','tag '+(q.status==='OPEN'?'pending':''),q.id+' · '+(q.status==='OPEN'?'待你决定':'已解决')),el('small','',q.category||'待确认'));card.append(tags,el('h3','',q.question));if(q.context)card.append(el('p','',q.context));if(q.suggestion)card.append(el('p','', '建议：'+q.suggestion));if(q.resolution)card.append(el('p','','结论：'+q.resolution));const links=el('div','links');q.targets.forEach(id=>links.append(link(id,'定位 '+id)));card.append(links,feedback(q.id,'你的答复 / 补充'));$('questions').append(card);}
if(!d.questions.length)$('questions').append(el('p','empty','暂无疑难。可直接沿时间轴查看完整安排。'));
function diagram(kind){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 260 120');svg.setAttribute('role','img');svg.setAttribute('aria-label','布局示意，非实际素材');const rect=(x,y,w,h,fill)=>{const n=document.createElementNS(svg.namespaceURI,'rect');for(const[k,v]of Object.entries({x,y,width:w,height:h,rx:6,fill}))n.setAttribute(k,v);svg.append(n)};rect(0,0,260,120,'#edf2e7');if(kind==='input'){rect(38,26,64,70,'#bacdaf');rect(101,17,64,82,'#5f8c76');rect(163,27,58,70,'#c6d2b6');}else if(kind==='focus'){rect(18,38,48,55,'#c6d2b6');rect(78,12,103,98,'#2c6d55');rect(194,38,48,55,'#c6d2b6');}else{rect(31,37,79,51,'#bacdaf');rect(149,37,79,51,'#2c6d55');const line=document.createElementNS(svg.namespaceURI,'path');line.setAttribute('d','M116 61h26m-7-6 7 6-7 6');line.setAttribute('stroke','#5f7a61');line.setAttribute('fill','none');line.setAttribute('stroke-width','3');svg.append(line)}return svg;}
function previewAsset(a){const fig=el('figure','asset');let media;if(a.preview){media=el('img');media.src=a.preview;media.alt=a.label;media.loading='lazy';}else if(a.diagram){media=diagram(a.diagram);}if(media){const button=el('button');button.type='button';button.setAttribute('aria-label','放大查看 '+a.label);button.append(media);button.addEventListener('click',()=>{$('image-title').textContent=a.label;$('image-content').replaceChildren(media.cloneNode(true));$('image-use').textContent=a.use+(a.status==='SCHEMATIC'?' · 布局示意，非实际素材':'');$('lightbox').showModal();});fig.append(button);}else fig.append(el('div','missing',a.status==='MISSING'?'待补图片':'材料已规划 · 尚未生成'));const caption=el('figcaption');caption.append(el('b','',a.label+' · '),document.createTextNode(a.use));if(a.status==='SCHEMATIC')caption.append(el('div','','布局示意 · 非实际素材'));if(a.source)caption.append(el('div','','来源：'+a.source));fig.append(caption);return fig;}
function visualCard(v){const card=el('article','visual'+(v.mode==='BASE'?' base':''));card.id=domId(v.id);card.dataset.search='';const tags=el('div','tags');tags.append(el('span','tag',v.id+' · '+modeText[v.mode]),el('span','tag '+(v.status!=='CONFIRMED'?'pending':''),statusText[v.status]),el('small','',v.segmentIds.join(' / ')));card.append(tags,el('h3','',v.title));const ranges=el('div','range-line');ranges.append(el('span','',v.mode==='BASE'?'底画保持可见':'动画实际显示'));v.visibleRanges.forEach(r=>ranges.append(el('time','',rangeText(r))));card.append(ranges,el('p','reason',v.reason));const design=el('div','design'+(!v.assets.length?' no-assets':''));const text=el('div');text.append(el('p','',v.summary));if(v.materialPlan)text.append(el('p','note','材料安排：'+v.materialPlan));design.append(text);if(v.assets.length){const gallery=el('div','gallery');v.assets.forEach(a=>gallery.append(previewAsset(a)));design.append(gallery);}card.append(design,el('p','handoff','交给下一段：'+v.handoff));if(v.phases.length){const details=el('details','detail');details.append(el('summary','','展开动作、镜头与音效 · '+v.phases.length+' 个节拍'));const beats=el('ol','beats');for(const p of v.phases){const li=el('li');li.append(el('time','',rangeText(p.range)),el('p','','口播触发：'+p.cue),el('p','',p.action),el('small','','镜头：'+(p.camera||'固定镜头')),el('small','','音效：'+(p.sound||'无')));beats.append(li)}details.append(beats);card.append(details);}if(v.feedbackHistory?.length){const details=el('details','detail');details.append(el('summary','','已吸收的修改意见'));for(const item of v.feedbackHistory)details.append(el('p','note',item));card.append(details);}card.append(feedback(v.id,'这段画面，你想怎样调整？'));return card;}
const segments=new Map(d.segments.map(s=>[s.id,s]));const owner=new Map();d.visuals.forEach(v=>v.segmentIds.forEach(id=>owner.set(id,v)));let chapter='',chapterN=0,cursor=d.scope.start;const rendered=new Set();
for(const s of d.segments){const v=owner.get(s.id);if(rendered.has(v.id))continue;rendered.add(v.id);const chapterName=s.chapter||'成片内容';if(chapterName!==chapter){chapter=chapterName;chapterN++;const ch=el('section','chapter');ch.id='chapter-'+chapterN;ch.append(el('span','num',String(chapterN).padStart(2,'0')),el('h2','',chapterName),el('time','',stamp(s.finalRange.start)));$('timeline').append(ch);const opt=el('option','',chapterName);opt.value=ch.id;$('chapters').append(opt);}
const block=el('section','block');const left=el('div','segments');for(const id of v.segmentIds){const cue=segments.get(id);if(cue.finalRange.start-cursor>.001)left.append(el('div','gap',rangeText({start:cursor,end:cue.finalRange.start})+' · 无展示字幕间隔（不代表删除）'));cursor=cue.finalRange.end;const row=el('article','cue'+(cue.kind==='EVENT'?' event-cue':''));row.id=domId(cue.id);row.dataset.search='';const final=el('div','final');final.append(el('time','',stamp(cue.finalRange.start)),el('small','','↓'),el('time','',stamp(cue.finalRange.end)));const body=el('div');body.append(el('span','cue-id',cue.id+(cue.kind==='EVENT'?' · 无字幕事件':'')),el('p','',cue.text));if(cue.note)body.append(el('div','note',cue.note));const links=el('div','links');(cue.questionIds||[]).forEach(id=>links.append(link(id,id+' 疑难')));if(links.childNodes.length)body.append(links);row.append(final,sources(cue.sourceRanges),body);left.append(row);}block.append(left,el('div','rail'),visualCard(v));$('timeline').append(block);}
if(d.scope.end-cursor>.001)$('timeline').append(el('div','gap',rangeText({start:cursor,end:d.scope.end})+' · 无展示字幕间隔（不代表删除）'));
for(const a of d.sourceDecisions){const row=el('tr');row.append(el('td','',a.id+' · '+({KEEP:'保留',DELETE:'删除',QUESTION:'待确认'}[a.decision])));const src=el('td');src.append(sources(a.sourceRanges));row.append(src,el('td','',a.text),el('td','',a.reason));$('audit').append(row);}if(!d.sourceDecisions.length){const row=el('tr'),cell=el('td','',d.isExample?'本示例未列完整源审稿表。正式作品须回收整条源素材的保留、删除与疑难决定。':'未提供源审稿决定，尚不能据此证明整条源素材已完成审稿。');cell.colSpan=4;row.append(cell);$('audit').append(row);}
$('timing').textContent='时间依据：'+d.timing.reference;$('approval-record').textContent=d.approval.status==='APPROVED'?'确认记录：'+d.approval.reference+' · 修订 '+d.approval.reviewRevision+' · '+d.approval.scope:'当前整份方案尚未确认；单项意见或浏览器草稿不会自动启动制作。';$('fingerprint').textContent='审稿标识 '+d.id+' / 修订 '+d.revision+' / '+d.fingerprint.slice(0,12);
if(d.timing.basis==='FROZEN')document.querySelector('.left-head span').textContent='冻结成片时间';if(d.timing.basis==='HISTORICAL')document.querySelector('.left-head span').textContent='历史成片时间';
$('chapters').addEventListener('change',e=>{if(e.target.value)$(e.target.value).scrollIntoView({block:'start'});});
let hits=[],hitIndex=-1;function showHit(step){if(!hits.length)return;hitIndex=(hitIndex+step+hits.length)%hits.length;hits[hitIndex].scrollIntoView({block:'center'});$('matches').textContent=(hitIndex+1)+' / '+hits.length;}
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLocaleLowerCase();document.querySelectorAll('.search-hit').forEach(n=>n.classList.remove('search-hit'));hits=q?[...document.querySelectorAll('[data-search]')].filter(n=>n.textContent.toLocaleLowerCase().includes(q)):[];hits.forEach(n=>n.classList.add('search-hit'));hitIndex=-1;$('matches').textContent=q?(hits.length+' 处'):' ';$('prev').disabled=$('next').disabled=!hits.length;});$('next').onclick=()=>showHit(1);$('prev').onclick=()=>showHit(-1);$('prev').disabled=$('next').disabled=true;
function feedbackText(){const entries=feedbackFields.filter(t=>t.value.trim()).map(t=>t.dataset.feedback+'\n'+t.value.trim());return entries.length?['作品：'+d.title,'审稿：'+d.id+' / 修订 '+d.revision+' / '+d.fingerprint,'以下为修改意见，尚需合入方案并确认：','',...entries.map(t=>t+'\n')].join('\n'):'';}
$('copy').onclick=async()=>{const text=feedbackText();if(!text){$('save-state').textContent='还没有填写修改意见。';return;}try{await navigator.clipboard.writeText(text);$('save-state').textContent='修改意见已复制，可以粘贴给我。';}catch{$('save-state').textContent='当前浏览器不能直接复制，请使用“下载修改意见”。';}};
$('download').onclick=()=>{const text=feedbackText();if(!text){$('save-state').textContent='还没有填写修改意见。';return;}const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=url;a.download='审稿修改意见-'+d.id.replace(/[^a-zA-Z0-9_-]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save-state').textContent='修改意见已导出，请把文件或文字交给我合入方案。';};
$('close').onclick=()=>$('lightbox').close();$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').close();});
</script>
